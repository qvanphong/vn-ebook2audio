# A voice worker on an NVIDIA GPU. Needs the NVIDIA driver and, on Linux, the NVIDIA Container Toolkit
# (on Windows, Docker Desktop with the WSL 2 backend).
#
#   WORKER_TOKEN=choose-a-secret docker compose -f docker-compose.worker-gpu.yml up -d --build
#
# Then add http://<this machine>:8780 and the token under Settings -> Voice machines on the main server.
services:
  voice-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker-cuda
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8780}:8780"
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN to a secret the main server will use}
      WORKER_NAME: ${WORKER_NAME:-gpu-worker}
      TTS_DEVICE: cuda
    volumes:
      - worker-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  worker-data:

networks:
  default:
    name: ebook2audio-net
